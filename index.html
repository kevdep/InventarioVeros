<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Inventario Diario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<body>

  <div class="container py-4">

    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3" style="text-align: center; font-size: 35px;">Inventario diario</h5>
        <div class="row g-3" id="inventario"></div>
        <div class="d-grid mt-4">
          <button class="btn btn-primary" onclick="generarResultado()">Generar resultado</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">Resultado para WhatsApp</h5>
        <textarea id="resultado" rows="10" class="w-100 mb-3" readonly></textarea>
        <div class="d-grid">
          <button id="btnCopiar" class="btn btn-primary" onclick="copiarResultado()">Copiar resultado</button>
          <button class="btn btn-success mt-2" onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
          <button class="btn btn-dark mt-2" onclick="generarImagen()">Generar imagen</button>
        </div>
        <div id="copiado" class="text-center mt-2 copiado">Copiado exitosamente</div>
      </div>
    </div>

    <div id="plantillaImagen" class="p-4 bg-white" style="
  width: 1400px;
  position:absolute;
  left:-9999px;
  color:black;
  font-family: Arial;
">

      <h3 style="
    text-align:center;
    color:black;
    margin-bottom:10px;
  ">
        Inventario Diario
      </h3>

      <p id="fechaImagen" style="
    color:black;
    margin-bottom:10px;
    font-size:14px;
  "></p>

      <div style="
    display:flex;
    gap:20px;
    align-items:flex-start;
  ">

        <div style="flex:1;">

          <table style="
        width:100%;
        border-collapse:collapse;
        color:black;
      ">

            <thead>
              <tr>

                <th style="
              border:1px solid black;
              padding:2px 6px;
              color:black;
              font-size:14px;
              line-height:1.1;
            ">
                  Producto
                </th>

                <th style="
              border:1px solid black;
              padding:2px 6px;
              color:black;
              font-size:14px;
              line-height:1.1;
              width:90px;
            ">
                  Stock
                </th>

              </tr>
            </thead>

            <tbody id="tabla1"></tbody>

          </table>

        </div>

        <div style="flex:1;">

          <table style="
        width:100%;
        border-collapse:collapse;
        color:black;
      ">

            <thead>
              <tr>

                <th style="
              border:1px solid black;
              padding:2px 6px;
              color:black;
              font-size:14px;
              line-height:1.1;
            ">
                  Producto
                </th>

                <th style="
              border:1px solid black;
              padding:2px 6px;
              color:black;
              font-size:14px;
              line-height:1.1;
              width:90px;
            ">
                  Estado
                </th>

              </tr>
            </thead>

            <tbody id="tabla2"></tbody>

          </table>

        </div>

      </div>
    </div>
  </div>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
